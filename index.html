<!DOCTYPE html>
<html>
<!--Created by Bonecuss from the forums of Kazamatsuri, a home for Key fans.-->
<!--Revived by Aroweeri (github.com/aroweeri) after Kazamatsuri went offline.-->
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aphorism Generator</title>
<link rel="icon" href="favicon.png" type="image/png">

<script src="lz-string.min.js"></script>
<script>

function changetext() {
	var url = window.location.href;
	var text;
	var person;
	if(url.lastIndexOf('?') != -1) 
	{
		var combined = url.substring(url.indexOf('?') + 1);
		LZString.compressToEncodedURIComponent(text);
		combined = LZString.decompressFromEncodedURIComponent(combined);
		var parts = combined.split('\0');
		text = parts[0];
		person = parts[1];
		
		document.getElementById("text").innerHTML = text;
		document.getElementById("person").innerHTML = "-" + person;

		document.getElementById("form").style.display = "none";
		document.getElementById("scene").style.display="flex";
		document.getElementById("createLink").style.display="inline";
		document.getElementById("main").style.minHeight="100dvh";
	} else {
		document.getElementById("form").style.display="flex";
		document.getElementById("scene").style.display="none";
		document.getElementById("createLink").style.display="none";
		document.getElementById("main").style.minHeight="0";
	}
}

function generate(){
	var url = window.location.href + "?";
	var tb = document.getElementById("tb");
	var text = tb.value;
	var tb2 = document.getElementById("tb2");
	var text2 = tb2.value;
	var textToEncode = (text + '\0' + text2).replace(/\=*$/, '');
	console.log("Text to encode: ", textToEncode);
	var data = LZString.compressToEncodedURIComponent(textToEncode);
	console.log("Encoded: ", data);
	url = url + data;
	window.history.pushState({}, "", url);
	changetext();
	play();
}

window.addEventListener("popstate", function(event) {
	resetPage();
});

window.addEventListener("pageshow", function(event) {
    if (event.persisted) {
		resetPage();
    }
});

function resetPage() {
	console.log("in resetPage");
	var audio = document.getElementById('bgm');
	audio.pause();
	audio.currentTime = 0;
	resetAllAnimations();
	document.getElementById("playImg").style.opacity = 1;
	document.getElementById("playButton").disabled=false;
	document.getElementById("playButton").style.cursor="pointer";
	changetext();
}

document.addEventListener("DOMContentLoaded", function() {
	document.getElementById("createLink").addEventListener("click", function() {
		resetPage();
	});

	document.getElementById("title").addEventListener("click", function() {
		resetPage();
	});
});

function play() {
	var audio = document.getElementById('bgm');
	audio.load();
	audio.play();
	document.getElementById("bg").style.animationPlayState = "running";
	document.getElementById("fade").style.animationPlayState = "running";
	document.getElementById("text").style.animationPlayState = "running";
	document.getElementById("person").style.animationPlayState = "running";
	document.getElementById("glow").style.animationPlayState = "running";
	document.getElementById("playImg").style.opacity = 0;
	
	//disable button until later
	document.getElementById("playButton").disabled=true;
	document.getElementById("playButton").style.cursor="default";

	const element = document.getElementById("bg");
	element.addEventListener("animationend", (event) => {
		resetAllAnimations();
		document.getElementById("playImg").style.opacity = 1;
		document.getElementById("playButton").disabled=false;
		document.getElementById("playButton").style.cursor="pointer";
	});
}

function resetAllAnimations() {
	resetAnimation(document.getElementById("bg"));
	resetAnimation(document.getElementById("fade"));
	resetAnimation(document.getElementById("text"));
	resetAnimation(document.getElementById("person"));
	resetAnimation(document.getElementById("glow"));
}

function resetAnimation(element) {
	element.style.animation = "none";
	element.offsetHeight; // Force reflow
	element.style.animation = "";
}

function toggleSound() {
	var isMuted = document.getElementById("bgm").muted;
	if (isMuted) {
		document.getElementById("bgm").muted = false;
		document.getElementById("soundImg").src = "sound-on.svg";
	} else {
		document.getElementById("bgm").muted = true;
		document.getElementById("soundImg").src = "sound-off.svg";
	}
}

async function copyLink() {
    try {
        await navigator.clipboard.writeText(window.location.href);

        const hint = document.getElementById("copyHint");
		hint.style.display = "inline";

        setTimeout(() => {
			hint.style.display = "none";
        }, 2000);

    } catch (err) {
        console.error("Failed to copy URL:", err);
    }
}

</script>

<style>

#bg{
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-image: url("bg.png");
	background-size:cover;
	animation: bganim 17s linear forwards;
	animation-play-state: paused;
}
#bg-darkener {
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-color:black;
	opacity:0.2;
	z-index:0;
}
#fade{
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-color:black;
	opacity:0;
	animation: fadeanim 15s linear forwards;
	animation-play-state: paused;
}
.glowText {
	text-shadow: 0px 0px 5px rgb(222,222,200);
	font-size: clamp(2rem, 7vw, 4rem);
	font-family: "Charm";
	font-weight: 700;
	color:rgb(255,255,230);
	opacity: 0;
}
#text{
	width:clamp(40vw, 50rem ,90vw);
	animation: fadeinanim 1.5s linear 5.00s forwards;
	animation-play-state: paused;
}
#person{
	width:clamp(40vw, 50rem ,90vw);
	text-align: right;
	animation: fadeinanim 1.5s linear 7.50s forwards;
	animation-play-state: paused;
}
#glow{
	position:absolute;
	height:250%;
	width:auto;
	top:-50%;
	left:0;
	transform:translateX(-100%);
	animation: glowanim 5s linear 3.75s forwards;
	animation-play-state: paused;
}
#form {
	flex:1;
	margin-top:1rem;
	text-align: center;
	vertical-align: middle;
	display:none;
	align-items:center;
	gap:1rem;
	flex-direction:column;
}

.formText {
	background-color : #0A0A0A;
	border: 1px solid double #707070;
	text-shadow: 0px 0px 15px black;
	font-size:35px;
	font-family: "Charm";
	font-weight: 700;
	text-align: center;
	color:white;
	vertical-align: middle;
}
#tb {
	width:clamp(40vw, 50rem ,90vw);
	resize:vertical;
}
#tb2 {
	width:clamp(40vw, 50rem ,90vw);
}
#submit {
	width:clamp(40vw, 50rem ,90vw);
}

#playButton {
	position:absolute;
	background:none;
	border:none;
	padding:0;
	cursor:pointer;
}

#playImg {
	width:clamp(5.0rem, 20vw, 10rem);
}

@keyframes bganim{
	0% {background-position: 0%}
	100% {background-position: 100%}
}
@keyframes glowanim{
	0% {transform:translateX(-100%)}
	100% {transform:translateX(200%)}
}
@keyframes fadeanim{
	0% {opacity:1}
	5% {opacity:1}
	20% {opacity:0}
	80% {opacity:0}
	100% {opacity:1}
}
@keyframes fadeinanim {
	0% {opacity:0}
	100% {opacity:1}
}
@keyframes fadeoutanim {
	0% {opacity:1}
	100% {opacity:0}
}

@font-face {
  font-family: 'Charm';
  src: url('Charm/Charm-Regular.ttf') format('truetype');
  font-weight: 400;
}

#textDiv {
	width:100%;
	height:100%;
	display:flex;
	align-items:center;
	justify-content:center;
	flex-direction: column;
	box-sizing: border-box;
	gap:2rem;
}

h1 {
	font-size:2rem;
	margin-top:0.5rem;
	margin-bottom:0.5rem;
}

p {
	font-size:1rem;
}

#copyHint {
	color:white;
	display:none;
}

#title {
	color:white;
	margin-left:1rem;
}

#soundButton {
	background:none;
	border:none;
	padding:0;
	cursor:pointer;
}

#copyButton {
	background:none;
	border:none;
	padding:0;
	cursor:pointer;
}

#controls {
	display:flex;
	align-items:center;
	position:absolute;
	bottom: 1vmax;
	right: 2vmax;
	gap:1rem;
}

#soundImg {
	filter: invert(1);
	width:clamp(2rem, 3vmax, 3rem);
}

#copyImg {
	filter: invert(1);
	width:clamp(2rem, 3vmax, 3rem);
}

#createLink {
	display:none;
	color:white;
	margin-right:1rem;
	text-align:center;
}

#githubLink {
	width:3rem;
}

header {
	background-color:#1c1c1c;
	width:100%;
	display:flex;
	align-items:center;
	justify-content:space-between;
	gap:1rem;
}

footer {
	background-color:#1c1c1c;
	width:100%;
	display:flex;
	align-items:center;
	justify-content:center;
	gap:1rem;
}

body {
	min-height:100dvh;
	margin:0;
	display:flex;
	flex-direction: column;
	background-color:black;
}

main {
	display:flex;
	flex-direction:column;
	flex:1;
	min-height:100dvh;
}

#scene {
	flex:1;
	width: 100%;
	position:relative;
	display:none; /* later set to flex on page load */
	align-items:center;
	justify-content:center;
	overflow:hidden;
}

a {
	color: white;
	text-decoration-thickness: 1px;
	text-underline-offset: .22em;
}

.mobile {
    display: none;
}

@media (max-width: 600px) {
    .desktop {
        display: none;
    }

    .mobile {
        display: block;
    }
}

</style>


</head>

<body onload="changetext();">
	<audio id="bgm" controls hidden>
		<source src="EF_WR002_normalized.mp3" type="audio/mp3">
	</audio>

	<main id="main">
		<header>
			<a href="index.html" id="title" style="text-decoration:none">
				<h1 class="desktop">Aphorism for you</h1>
				<h1 class="mobile">Aphorism4U</h1>
			</a>
			<a id="createLink" href="index.html">
				<p>Make an Aphorism</p>
			</a>
		</header>

		<div id="scene">
			<div id="bg"></div>
			<div id="bg-darkener"></div>
			<div id="textDiv">
				<div id="text" class="glowText"></div>
				<div id="person" class="glowText"></div>
			</div>
			<img id="glow" src="glow_yellow.png"/>
			<div id="fade"></div>
			<button type="button" id="playButton" onclick="play()">
				<img src="play_icon.png" id="playImg"/>
			</button>
			<div id="controls">
				<p id="copyHint" style="margin:0;text-align:center;">Link Copied!</p>
				<button type="button" id="copyButton" onclick="copyLink()">
					<img src="fluent--clipboard-link-20-regular.svg" id="copyImg"/>
				</button>
				<button type="button" id="soundButton" onclick="toggleSound()">
					<img src="sound-on.svg" id="soundImg"/>
				</button>
			</div>
		</div>

		<div id="form">
			<textarea rows="4" id="tb" class="formText" placeholder="What Was Said?"></textarea>
			<input type="text" name="tb2" id="tb2" class="formText" placeholder="Who Said It?">
			<input type="submit" value="Generate" class="formText" id="submit" onclick="generate()">
		</div>
	</main>

		

	<footer>
		<a href="http://www.github.com/aroweeri/Aphorism-Generator">
			<p>github</p>
		</a>
		<a href="https://web.archive.org/web/20250725155423/https://kazamatsuri.org/">
			<p>kazamatsuri</p>
		</a>
	</footer>


</body>

</html>
