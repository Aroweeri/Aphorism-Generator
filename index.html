<!DOCTYPE html>
<html>
<!--Created by Bonecuss from the forums of Kazamatsuri, a home for Key fans.-->
<!--Revived by Aroweeri (github.com/aroweeri) after Kazamatsuri went offline.-->
<head>
<title>Aphorism Generator</title>

<script>

function utf8_to_b64(str) {
	return window.btoa(unescape(encodeURIComponent(str)));
}

function b64_to_utf8(str) {
	return decodeURIComponent(escape(window.atob(str)));
}

function changetext() {
	var url = window.location.href;
	var text;
	var person;
	if(url.lastIndexOf('?') != -1) 
	{
		// Handle old-style ?[text]?[person] URLs
		if (url.indexOf('?') != url.lastIndexOf('?')) {
			text = url.substring(url.indexOf('?')+1, url.lastIndexOf('?'));
			person = url.substring(url.lastIndexOf('?')+1);
			text = decodeURIComponent(text);	
			person = decodeURIComponent(person);
			text = b64_to_utf8(text);
			person = b64_to_utf8(person);
		} else { // Handle new-style ?[text\0person] URLs
			var combined = url.substring(url.indexOf('?') + 1);
			combined = decodeURIComponent(combined);
			combined = b64_to_utf8(combined);
			var parts = combined.split('\0');
			text = parts[0];
			person = parts[1];
		}
		
		document.getElementById("text").innerHTML = "<br> <br> <br> " + text;
		
		if (!(text.length>40))
		{
			document.getElementById("person").innerHTML = "<br> <br> <br> <br>- " + person;
		}
		else
		{
			document.getElementById("person").innerHTML = "<br> <br> <br> <br> <br>- " + person;
		}
		
		var tb = document.getElementById("tb");
		var tb2 = document.getElementById("tb2");
		var submit = document.getElementById("submit");
		tb.parentNode.removeChild(tb);
		tb2.parentNode.removeChild(tb2);
		submit.parentNode.removeChild(submit);
	}
}

function generate(){
	var url = window.location.href + "?";
	var tb = document.getElementById("tb");
	var text = tb.value;
	var tb2 = document.getElementById("tb2");
	var text2 = tb2.value;
	var data = utf8_to_b64(text + '\0' + text2).replace(/\=*$/, '');
	url = url + data;
	window.history.pushState({}, "", url);
	changetext();
	play();
}

function play() {
	var audio = document.getElementById('bgm');
	audio.play();
	document.getElementById("bg").style.animationPlayState = "running";
	document.getElementById("fade").style.animationPlayState = "running";
	document.getElementById("text").style.animationPlayState = "running";
	document.getElementById("person").style.animationPlayState = "running";
	document.getElementById("glow").style.animationPlayState = "running";
}

</script>

<style>

body {
	background-color:green;
}

div#bg{
	background-image: url("bg.png");
	width:800px; 
	height:320px; 
	position: absolute;
	top: 50%;
	left: 50%;
	margin-right: -50%;
	transform: translate(-50%, -50%);
	animation: bganim 15s linear forwards;
	animation-play-state: paused;
}
div#bg-darkener {
	width:800px;
	height:320px;
	position:absolute;
	top:50%;
	left:50%;
	margin-right:-50%
	transform:translate(-50%, -50%);
	color:rgb(0,0,0);
	opacity:0.2;
	z-index:1;
}
div#fade{
	background-color:black;
	width:800px; 
	height:320px; 
	position: absolute;
	top: 50%;
	left: 50%;
	margin-right: -50%;
	transform: translate(-50%, -50%);
	opacity:0;
	animation: fadeanim 15s linear forwards;
	animation-play-state: paused;
}
.glowText {
	text-shadow: 0px 0px 5px rgb(222,222,200);
	font-size:35px;
	font-family: "Charm";
	font-weight: 700;
	color:rgb(255,255,230);
	vertical-align: middle;
	position: absolute;
	opacity: 0;
	transform: translate(-50%, -50%);
	animation: textfadeanim 2s linear 6.25s forwards;
	animation-play-state: paused;
}
div#text{
	text-align: center;
	width:520px; 
	height:320px; 
	top: 50%;
	left: 48%;
	padding-right: 20px;
}
div#person{
	text-align: right;
	width:600px; 
	height:320px; 
	top: 50%;
	left: 55%;
	padding-right: 400px;
}
div#glow{
	background-image: url("glow.png");
	background-position: -900px -225px;
	background-repeat: no-repeat;
	width:800px; 
	height:320px; 
	position: absolute;
	top: 50%;
	left: 50%;
	margin-right: -50%;
	transform: translate(-50%, -50%);
	animation: glowanim 5s linear 3.75s forwards;
	animation-play-state: paused;
}
div#form {
	position: absolute;
	top: 77%;
	left: 50%;
	width:800px; 
	margin-right: -50%;
	transform: translate(-50%, -50%);
	text-align: center;
	vertical-align: middle;
}

.formText {
	background-color : #0A0A0A;
	border: 1px solid double #707070;
	text-shadow: 0px 0px 15px black;
	font-size:35px;
	font-family: "Charm";
	font-weight: 700;
	text-align: center;
	color:white;
	vertical-align: middle;
}
input#tb {
	width:400px; 
}
input#tb2 {
	width:220px; 
}
input#submit {
	width:150px; 
}

@keyframes bganim{
	0% {background-position: 0px 0px;}
	100% {background-position: -200px 0px}
}
@keyframes glowanim{
	0% {background-position: -900px -225px}
	100% {background-position: 900px -225px}
}
@keyframes fadeanim{
	0% {opacity:1;}
	10% {opacity:1;}
	25% {opacity:0;}
	85% {opacity:0;}
	100% {opacity:1}
}
@keyframes textfadeanim{
	0% {opacity:0}
	100% {opacity:1}
}

@font-face {
  font-family: 'Charm';
  src: url('Charm/Charm-Regular.ttf') format('truetype');
  font-weight: 400;
}

@font-face {
  font-family: 'Charm';
  src: url('Charm/Charm-Bold.ttf') format('truetype');
  font-weight: 700;
}

</style>

</head>

<body onload="changetext();">
	<audio id="bgm" controls hidden>
		<source src="EF_WR002.mp3" type="audio/mp3">
	</audio>
	<a type="button" id="play" onclick="play()">
		<img alt="Toggle audio" src="play_icon.png"/>
	</a>

	<div id="form">
		<input type="text" name="tb" id="tb" class="formText" placeholder="Aphorism Text Here">
		<input type="text" name="tb2" id="tb2" class="formText" placeholder="Author">
		<input type="submit" value="Generate" class="formText" id="submit" onclick="generate()">
	</div>

	<div id="bg"/>
	<!--<div id="bg-darkener"/>-->
	<div id="text" class="glowText">	
		<br>
		<br>
		<br>
		Even cats fall from poles
	</div>
	<div id="person" class="glowText">	
		<br>
		<br>
		<br>
		<br>
		Inohara Masato
	</div>

	<div id="glow"/>
	<div id="fade"/> 
</body>

</html>
