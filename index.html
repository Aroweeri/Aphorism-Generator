<!DOCTYPE html>
<html>
<!--Created by Bonecuss from the forums of Kazamatsuri, a home for Key fans.-->

<head>
<title>Aphorism Generator</title>

<script>

function utf8_to_b64(str) {
	return window.btoa(unescape(encodeURIComponent(str)));
}

function b64_to_utf8(str) {
	return decodeURIComponent(escape(window.atob(str)));
}

function changetext() {
	var url = window.location.href;
	var text;
	var person;
	if(url.lastIndexOf('?') != -1) 
	{
		// Handle old-style ?[text]?[person] URLs
		if (url.indexOf('?') != url.lastIndexOf('?')) {
			text = url.substring(url.indexOf('?')+1, url.lastIndexOf('?'));
			person = url.substring(url.lastIndexOf('?')+1);
			text = decodeURIComponent(text);	
			person = decodeURIComponent(person);
			text = b64_to_utf8(text);
			person = b64_to_utf8(person);
		} else { // Handle new-style ?[text\0person] URLs
			var combined = url.substring(url.indexOf('?') + 1);
			combined = decodeURIComponent(combined);
			combined = b64_to_utf8(combined);
			var parts = combined.split('\0');
			text = parts[0];
			person = parts[1];
		}
		
		document.getElementById("text").innerHTML = text;
		document.getElementById("person").innerHTML = "-" + person;
		
		var form = document.getElementById("form");
		form.style.display = "none";
	} else {
		var form = document.getElementById("form");
		form.style.display = "inline";
	}
}

function generate(){
	var url = window.location.href + "?";
	var tb = document.getElementById("tb");
	var text = tb.value;
	var tb2 = document.getElementById("tb2");
	var text2 = tb2.value;
	var data = utf8_to_b64(text + '\0' + text2).replace(/\=*$/, '');
	url = url + data;
	window.history.pushState({}, "", url);
	changetext();
	play();
}

function play() {
	var audio = document.getElementById('bgm');
	audio.load();
	audio.play();
	document.getElementById("bg").style.animationPlayState = "running";
	document.getElementById("fade").style.animationPlayState = "running";
	document.getElementById("text").style.animationPlayState = "running";
	document.getElementById("person").style.animationPlayState = "running";
	document.getElementById("glow").style.animationPlayState = "running";
	document.getElementById("playImg").style.opacity = 0;
	
	//disable button until later
	document.getElementById("playButton").disabled=true;
	document.getElementById("playButton").style.cursor="default";

	const element = document.getElementById("bg");
	element.addEventListener("animationend", (event) => {
		resetAllAnimations();
		document.getElementById("playImg").style.opacity = 1;
		document.getElementById("playButton").disabled=false;
		document.getElementById("playButton").style.cursor="pointer";
	});
}

function resetAllAnimations() {
	resetAnimation(document.getElementById("bg"));
	resetAnimation(document.getElementById("fade"));
	resetAnimation(document.getElementById("text"));
	resetAnimation(document.getElementById("person"));
	resetAnimation(document.getElementById("glow"));
}

function resetAnimation(element) {
	element.style.animation = "none";
	element.offsetHeight; // Force reflow
	element.style.animation = "";
}

</script>

<style>

#bg{
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-image: url("bg.png");
	background-size:cover;
	animation: bganim 17s linear forwards;
	animation-play-state: paused;
}
#bg-darkener {
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-color:black;
	opacity:0.2;
	z-index:0;
}
#fade{
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	background-color:black;
	opacity:0;
	animation: fadeanim 15s linear forwards;
	animation-play-state: paused;
}
.glowText {
	text-shadow: 0px 0px 5px rgb(222,222,200);
	font-size:35px;
	font-family: "Charm";
	font-weight: 700;
	color:rgb(255,255,230);
	opacity: 0;
}
#text{
	width:100%;
	animation: fadeinanim 1.5s linear 5.00s forwards;
	animation-play-state: paused;
}
#person{
	width:100%;
	text-align: right;
	animation: fadeinanim 1.5s linear 7.50s forwards;
	animation-play-state: paused;
}
#glow{
	position:absolute;
	height:250%;
	width:auto;
	top:-50%;
	left:0;
	transform:translateX(-100%);
	animation: glowanim 5s linear 3.75s forwards;
	animation-play-state: paused;
}
#form {
	width:50%;
	height:50%;
	text-align: center;
	vertical-align: middle;
	display:none;
}
#scene {
	width:80%;
	height:80%;
	aspect-ratio:800/320;
	position:relative;
	display:flex;
	align-items:center;
	justify-content:center;
	overflow:hidden;
}

body {
	width:100%;
	height:100%;
	background-color:black;
	display:flex;
	align-items:center;
	justify-content:center;
}

.formText {
	background-color : #0A0A0A;
	border: 1px solid double #707070;
	text-shadow: 0px 0px 15px black;
	font-size:35px;
	font-family: "Charm";
	font-weight: 700;
	text-align: center;
	color:white;
	vertical-align: middle;
}
#tb {
}
#tb2 {
}
#submit {
}

#playButton {
	position:absolute;
	inset:0;
	width:100%;
	height:100%;
	display:flex;
	align-items:center;
	justify-content:center;
	background:none;
	border:none;
	padding:0;
	cursor:pointer;
}

#playImg {
	width:10%;
}

@keyframes bganim{
	0% {background-position: 0% 0px}
	100% {background-position: 100% 0px}
}
@keyframes glowanim{
	0% {transform:translateX(-100%)}
	100% {transform:translateX(200%)}
}
@keyframes fadeanim{
	0% {opacity:1;}
	5% {opacity:1;}
	20% {opacity:0;}
	80% {opacity:0;}
	100% {opacity:1}
}
@keyframes fadeinanim {
	0% {opacity:0};
	100% {opacity:1};
}
@keyframes fadeoutanim {
	0% {opacity:1};
	100% {opacity:0};
}

@font-face {
  font-family: 'Charm';
  src: url('Charm/Charm-Regular.ttf') format('truetype');
  font-weight: 400;
}

#textDiv {
	width:50%;
	height:50%;
	display:flex;
	align-items:center;
	justify-content:center;
	flex-direction: column;
	padding:2%;
	box-sizing: border-box;
}

</style>

</head>

<body onload="changetext();">
	<audio id="bgm" controls hidden>
		<source src="EF_WR002_normalized.mp3" type="audio/mp3">
	</audio>

	<div id="scene">

		<div id="bg"></div>
		<div id="bg-darkener"></div>
		<div id="textDiv">
			<div id="text" class="glowText"></div>
			<div id="person" class="glowText"></div>
		</div>
		<img id="glow" src="glow.png"/>
		<div id="fade"></div>
		<button type="button" id="playButton" onclick="play()">
			<img src="play_icon.png" id="playImg"/>
		</button>

	</div>
	<div id="form">
		<input type="text" name="tb" id="tb" class="formText" placeholder="Aphorism Text Here">
		<input type="text" name="tb2" id="tb2" class="formText" placeholder="Author">
		<input type="submit" value="Generate" class="formText" id="submit" onclick="generate()">
	</div>

</body>

</html>
